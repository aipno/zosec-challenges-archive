{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>支付密码验证</h2>
  <p>请输入 4 位数字支付密码。</p>
  {% if msg %}
    {% if flag %}
      <p class="msg-ok" data-result="success">{{ msg }}</p>
      <pre>flag = {{ flag }}</pre>
    {% elif msg == '请求过于频繁，请稍后再试' %}
      <p class="msg-bad" data-result="rate-limited">{{ msg }}</p>
    {% else %}
      <p class="msg-bad" data-result="wrong">{{ msg }}</p>
    {% endif %}
  {% endif %}
  <form method="post" action="/verify">
    <label for="pin">支付密码（4 位数字）</label>
    <input type="text" id="pin" name="pin" placeholder="0000" maxlength="4" autocomplete="off">
    <button type="submit">验证</button>
  </form>
</div>

{% endblock %}
